[env]
; firmware_version.py stamps SH_FIRMWARE_VERSION / SH_FIRMWARE_TARGET (see ../OTA.md)
extra_scripts =
    pre:rename_output.py
    pre:../scripts/firmware_version.py
custom_firmware_name = gateway
monitor_speed = 115200
lib_extra_dirs = ../lib
; Pinned so CI release builds match local builds.
platform = espressif32@6.12.0
framework = arduino
; OTA needs two app slots (app0/app1); the "spiffs" data partition holds the
; LittleFS cache of node images the gateway relays over ESP-NOW.
board_build.partitions = default.csv
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3


[env:esp32dev]
board = esp32dev
build_flags =
    -DSH_TRANSPORT_ESPNOW


[env:wokwi]
board = esp32dev
build_flags =
    -DSH_TRANSPORT_MOCK
    -DSH_OTA_DISABLED
