; Room node: switches relays from the room's Ably MQTT channel,
; user/<userId>/room/<roomId>. Copy include/secrets.example.h to
; include/secrets.h and fill it in before the first USB flash; after that the
; board updates itself from GitHub Releases (see ../OTA.md).

[env]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
; firmware_version.py stamps SH_FIRMWARE_VERSION / SH_FIRMWARE_TARGET
extra_scripts =
    pre:rename_output.py
    pre:../scripts/firmware_version.py
custom_firmware_name = room-node
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1

; ESP32 dev boards (ESP32-WROOM / DevKitC)
[env:esp32dev]
; Pinned so CI release builds match local builds.
platform = espressif32@6.12.0
board = esp32dev
; OTA needs two app slots (app0/app1).
board_build.partitions = default.csv

; NodeMCU v2/v3 (ESP-12E based)
[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2

; Generic ESP8266 modules (ESP-12E / ESP-12F)
[env:esp8266]
platform = espressif8266@4.2.1
board = esp12e

; Wokwi simulator: ESP32 with an 8-channel relay board and LEDs,
; see ../simulations/room-node. Joins Wokwi-GUEST instead of WIFI_SSID and
; still talks to the real Ably channel through Wokwi's internet gateway.
[env:wokwi]
platform = espressif32@6.12.0
board = esp32dev
build_flags =
    -DSH_WOKWI
    -DSH_OTA_DISABLED
