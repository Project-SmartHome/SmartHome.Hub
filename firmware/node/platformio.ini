[env]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../lib
; firmware_version.py stamps SH_FIRMWARE_VERSION / SH_FIRMWARE_TARGET (see ../OTA.md)
extra_scripts =
    pre:rename_output.py
    pre:../scripts/firmware_version.py
custom_firmware_name = node
lib_deps =
    bblanchon/ArduinoJson@7.4.3

; ESP32 dev boards (ESP32-WROOM / DevKitC)
[env:esp32dev]
; Pinned so CI release builds match local builds.
platform = espressif32@6.12.0
board = esp32dev
; OTA needs two app slots (app0/app1).
board_build.partitions = default.csv
build_flags =
    -D SH_NODE_ESP32
build_src_filter =
    +<*>
    -<hal/esp8266/>

; NodeMCU v2/v3 (ESP-12E based)
[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
build_flags =
    -D SH_NODE_ESP8266
build_src_filter =
    +<*>
    -<hal/esp32/>

; Generic ESP8266 modules (ESP-12E / ESP-12F)
[env:esp8266]
platform = espressif8266@4.2.1
board = esp12e
build_flags =
    -D SH_NODE_ESP8266
build_src_filter =
    +<*>
    -<hal/esp32/>
