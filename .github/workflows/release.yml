name: Release

# Manually triggered from the Actions tab ("Run workflow").
# 1. Runs CI as a gate
# 2. Auto-increments the version from the latest vX.Y.Z tag
# 3. Builds and pushes the Docker image to GHCR with the version tags
# 4. Creates the git tag + GitHub Release with auto-generated notes
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to increment'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

# Never run two releases at once (they would compute the same version)
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/backend.yml

  release:
    name: Tag, publish image & release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create tag + GitHub Release
      packages: write   # push to GHCR
    steps:
      - name: Ensure release runs from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases can only be created from main (current ref: ${{ github.ref }})"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history + tags to find the latest version

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git fetch --tags --force

          # Latest stable semver tag (vX.Y.Z), sorted by version not lexically
          latest=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          latest=${latest:-v0.0.0}

          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump type: $BUMP"; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "::error::Tag ${next} already exists"
            exit 1
          fi

          echo "previous=${latest}" >> "$GITHUB_OUTPUT"
          echo "tag=${next}"        >> "$GITHUB_OUTPUT"
          echo "version=${next#v}"  >> "$GITHUB_OUTPUT"
          echo "### Releasing ${next} (previous: ${latest}, bump: ${BUMP})" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # e.g. 1.4.2, 1.4, 1 (when >=1), latest, sha-abc1234
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./Dockerfile
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=smarthome-hub
          cache-to: type=gha,mode=max,scope=smarthome-hub

      # Tag + release are created only after the image is pushed successfully,
      # so a failed build never leaves an orphan tag behind.
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          notes=$(printf '## Docker image\n\n```bash\ndocker pull %s:%s\n```\n' "$image" "$VERSION")

          args=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes --notes "$notes")
          if git rev-parse -q --verify "refs/tags/${PREVIOUS}" >/dev/null; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi

          gh release create "$TAG" "${args[@]}"
          echo "Released **${TAG}** → \`${image}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
