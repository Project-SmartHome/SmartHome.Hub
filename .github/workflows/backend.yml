name: Backend CI

# Runs on every push / PR to main. Validates the backend and the Dockerfile
# but does NOT publish an image. Images are only published by release.yml.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/backend.yml'
  # Lets release.yml run this as a gate before publishing
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall -q app run.py

      - name: Smoke test health endpoint
        run: |
          python - <<'EOF'
          from app import create_app

          client = create_app("testing").test_client()
          resp = client.get("/api/health")
          assert resp.status_code == 200, f"unexpected status {resp.status_code}"
          assert resp.get_json()["status"] == "healthy", resp.get_json()
          print("Health check OK:", resp.get_json())
          EOF

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./Dockerfile
          push: false
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=0.0.0-ci.${{ github.sha }}
          cache-from: type=gha,scope=smarthome-hub
          cache-to: type=gha,mode=max,scope=smarthome-hub
